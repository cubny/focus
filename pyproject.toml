[project]
name = "focus-music"
version = "0.1.0"
description = "Focus music generator with neural entrainment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["music", "focus", "productivity", "neural-entrainment", "binaural", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "google-genai>=1.0.0",
    "numpy>=2.0.0",
    "sounddevice>=0.5.0",
    "scipy>=1.14.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
focus = "focus.cli:main"

[project.urls]
Homepage = "https://github.com/cubny/focus"
Repository = "https://github.com/cubny/focus"
Issues = "https://github.com/cubny/focus/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/focus"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
